[project]
name = "perceptron-project"
version = "0.1.0"
description = "A simple single-layer perceptron classifier with plots and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "sklearn-stubs",
]

[project.scripts]
perceptron = "perceptron_project.perceptron:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perceptron_project"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.uv.sources]
sklearn-stubs = { git = "https://github.com/juliancoffeelab/scikit-learn-stubs.git" }




